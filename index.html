<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#f6f2ea" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SANGU NoteBase — წმ. ანდრიას ქართული უნივერსიტეტის სასწავლო მასალები: კონსპექტები, სილაბუსები და გამოცდის მასალები ერთ რვეულში."
    />
    <!-- Self-hosted web fonts (src/styles/fonts.css), regenerate with: node scripts/fetch-fonts.mjs -->
    <!-- fonts:preload -->
    <link rel="preload" href="/src/assets/fonts/caveat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/noto-sans-georgian-georgian.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/noto-sans-georgian-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/noto-serif-georgian-georgian.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/noto-serif-georgian-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <!-- /fonts:preload -->
    <!-- Same srcset/sizes as the header logo (src/config/logo.ts), so this preload is the image it uses -->
    <link
      rel="preload"
      as="image"
      href="/logo-72.webp"
      imagesrcset="/logo-36.webp 36w, /logo-72.webp 72w, /logo-108.webp 108w"
      imagesizes="(min-width: 640px) 36px, 32px"
      fetchpriority="high"
    />
    <!-- Avatars and material files come from this bucket: open the connection early -->
    <link rel="preconnect" href="https://notebase-project.s3.amazonaws.com" />
    <link rel="dns-prefetch" href="https://notebase-project.s3.amazonaws.com" />
    <!-- Paper colour before the CSS bundle arrives, so there is no white flash -->
    <style>
      html { background: #fffdf9; }
    </style>
    <title>SANGU NoteBase</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
